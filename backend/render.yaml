services:
  - type: web
    name: backbench-games-server
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CLIENT_ORIGIN
        sync: false # set this in the Render dashboard, see README notes
      - key: PORT
        value: 4000
